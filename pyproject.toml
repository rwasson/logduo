# pyproject.toml

[tool.setuptools.package-data]
logduo = [
  "py.typed",
  "internals/artifacts/logduo_docs/README.txt",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logduo"
readme = "README.md"
version = "0.2.0"
authors = [{ name = "R. Wasson", email = "r.wasson.dev@gmail.com" }]
description = "Easy logging and output management for Python scripts and interactive sessions"

license = "MIT"
license-files = ["LICENSE"]

requires-python = ">=3.13"

keywords = [
  "logging",
  "loguru",
  "rich",
  "console",
  "jsonl",
  "structured-logging",
  "python"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]

# --- Runtime dependencies -----------------------------------------------------
dependencies = [
  "loguru>=0.7",
  "rich>=13,<16",
  "cerberus>=1.3",
  "psutil>=5.9,<9.0",
  "packaging>=26.3",
  "platformdirs>=4.11",
  "findpython>=0.6",
  "colorama>=0.4.6"
]

[project.urls]
Homepage = "https://github.com/rwasson/logduo"
Repository = "https://github.com/rwasson/logduo"
Issues = "https://github.com/rwasson/logduo/issues"

# --- Optional dependencies ----------------------------------------------------
[project.optional-dependencies]
dev = [
  "build",
  "ruff>=0.16.1",
  "mypy>=2.3",
  "vulture",
  "types-setuptools>=83",
  "types-requests>=2.33",
  "pytest>=9.0.0",
  "pytest-cov>=5.0.0",
  "pytest-json-report",
  "pytest-rerunfailures>=16.4",
  "pytest-random-order" ,
  "pytest-timeout"
]


# --- setuptools ---------------------------------------------------------------
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]


# --- logduo -------------------------------------------------------------------
[tool.logduo]
console_theme = "light"
keep = 3


# --- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
exclude = ["deprecated"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# These installed third-party libraries do not provide complete typing metadata.
# Suppress only that typing complaint; Logduo itself remains strictly checked.
module = [
    "cerberus",
    "cerberus.*",
    "pandas",
    "pandas.*",
    "statsmodels",
    "statsmodels.*",
    "matplotlib",
    "matplotlib.*",
    "numpy",
    "numpy.*",
    "prettytable",
    "prettytable.*",
]
ignore_missing_imports = true


ignore_missing_imports = true
# --- Ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["build", "deprecated"]     # exclude certain directories

[tool.ruff.lint]
select = [
    "E",
    "F",
    "ANN",
    "UP",
    "PLR",
    "B",
    "RUF059",
    "RUF100",
]

ignore = [
    "ANN401",                  # any-type
    "PLR0912",        # too-many-branches
]

[tool.ruff.lint.per-file-ignores]
# "src/logduo/__init__.py" = ["F401"]   # unused-import

[tool.ruff.lint.pylint]
max-args = 15

[tool.ruff.lint.isort]
# To sort imports, in Terminal:
# run ruff check src --select I --fix
combine-as-imports = true
force-single-line = false  # if false, allows: from typing import Any, Callable
order-by-type = false  # false preserves expected order
